[project]
name = "subforest"
version = "0.1.0"
description = "Structural navigation for agentic retrieval: return the retrieval-induced sub-forest, not flat chunks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ariel A.", email = "ariel.deibe@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14.1",
]

[project.scripts]
subforest = "subforest.cli:main"

[project.optional-dependencies]
yaml = [
    "pyyaml>=6.0.3",
]
mcp = [
    "mcp>=2.3",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["›"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
addopts = "--doctest-modules"
doctest_optionflags = ["ELLIPSIS"]
